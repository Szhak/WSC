<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Book Marketplace</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>

<body class="min-h-screen">
  <div class="mesh" id="mesh"></div>
  <div class="noise"></div>

  <!-- COMMON NAVBAR MOUNT -->
  <div id="app-navbar"></div>

  <main class="min-h-[calc(100vh-56px)] flex items-center justify-center px-4">
    <div class="panel w-full max-w-md rounded-3xl p-6 md:p-7 shadow-2xl reveal">

      <!-- ====== LOGIN BLOCK ====== -->
      <div id="login-block">
        <div class="text-center mb-5">
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight" data-i18n="login_title"></h1>
          <p class="text-sm mt-1" style="color: var(--muted2)" data-i18n="login_subtitle"></p>
        </div>

        <form id="login-form" class="space-y-3">
          <div>
            <label class="block text-xs mb-1" style="color: var(--muted2)" data-i18n="email_label"></label>
            <input id="email" type="email" class="inp" autocomplete="email"
                   data-i18n-placeholder="email_placeholder" placeholder=""/>
            <p id="err-email" class="text-xs mt-1 text-red-400 hidden" data-i18n="err_email"></p>
          </div>

          <div>
            <label class="block text-xs mb-1" style="color: var(--muted2)" data-i18n="password_label"></label>
            <div class="relative">
              <input id="password" type="password" class="inp pr-12" autocomplete="current-password"
                     data-i18n-placeholder="password_placeholder" placeholder=""/>
              <button type="button" id="toggle-pass"
                      class="absolute right-2 top-1/2 -translate-y-1/2 btn-ghost text-xs px-2 py-1"
                      data-i18n="show_btn">
              </button>
            </div>
            <p id="err-password" class="text-xs mt-1 text-red-400 hidden" data-i18n="err_password"></p>
          </div>

          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center gap-3">
              <button type="button" id="forgot-btn" class="text-sm underline font-semibold" data-i18n="forgot_btn"></button>
              <a href="register.html" class="text-sm underline font-semibold" data-i18n="create_account"></a>
            </div>
          </div>

          <button id="login-btn" type="submit" class="btn-primary w-full mt-2" data-i18n="login_btn"></button>

          <p class="text-center text-sm mt-2" style="color: var(--muted)">
            <span data-i18n="no_account"></span>
            <a href="register.html" class="underline font-semibold" data-i18n="register_btn"></a>
          </p>
        </form>
      </div>

      <!-- ====== RESET BLOCK ====== -->
      <div id="reset-block" class="hidden">
        <div class="text-center mb-5">
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight" data-i18n="reset_title"></h1>
          <p class="text-sm mt-1" style="color: var(--muted2)" data-i18n="reset_subtitle"></p>
        </div>

        <form id="reset-form" class="space-y-3">
          <div>
            <label class="block text-xs mb-1" style="color: var(--muted2)" data-i18n="new_password_label"></label>
            <input id="newPassword" type="password" class="inp" data-i18n-placeholder="password_placeholder" placeholder=""/>
          </div>

          <div>
            <label class="block text-xs mb-1" style="color: var(--muted2)" data-i18n="repeat_password_label"></label>
            <input id="repeatPassword" type="password" class="inp" data-i18n-placeholder="password_placeholder" placeholder=""/>
          </div>

          <button id="reset-btn" type="submit" class="btn-primary w-full mt-2" data-i18n="update_password_btn"></button>
          <button id="back-to-login" type="button" class="btn-ghost w-full" data-i18n="back_to_login"></button>
        </form>
      </div>

      <p id="page-msg" class="text-sm mt-3 text-center"></p>
    </div>
  </main>

  <!-- Forgot password modal -->
  <div id="forgot-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 px-4">
    <div class="panel w-full max-w-sm rounded-2xl p-5">
      <h3 class="text-lg font-bold mb-2" data-i18n="forgot_modal_title"></h3>
      <p class="text-sm mb-3" style="color: var(--muted2)" data-i18n="forgot_modal_text"></p>
      <input id="forgot-email" type="email" class="inp mb-3" data-i18n-placeholder="email_placeholder" placeholder=""/>
      <div class="flex gap-2">
        <button id="forgot-send" class="btn-primary flex-1" data-i18n="send_link"></button>
        <button id="forgot-close" class="btn-ghost flex-1" data-i18n="cancel_btn"></button>
      </div>
    </div>
  </div>

  <!--  COMMON UTILS (global App) -->
  <script src="utils.js"></script>

  <script>
    (async function () {
      await App.initCommon({ i18nUrl: "i18n.json" });

      const API_URL = App.API_URL; // "/api"
      const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      const qs = App.qs;

      const els = {
        loginBlock: qs('#login-block'),
        resetBlock: qs('#reset-block'),
        pageMsg: qs('#page-msg'),

        loginForm: qs('#login-form'),
        email: qs('#email'),
        password: qs('#password'),
        loginBtn: qs('#login-btn'),
        togglePass: qs('#toggle-pass'),

        resetForm: qs('#reset-form'),
        newPassword: qs('#newPassword'),
        repeatPassword: qs('#repeatPassword'),
        resetBtn: qs('#reset-btn'),
        backToLogin: qs('#back-to-login'),

        modal: qs('#forgot-modal'),
        forgotBtn: qs('#forgot-btn'),
        forgotClose: qs('#forgot-close'),
        forgotSend: qs('#forgot-send'),
        forgotEmail: qs('#forgot-email')
      };

      function setError(id, isError, msgKeyFallback) {
        const input = qs('#' + id);
        const err = qs('#err-' + id);
        input.classList.toggle('error', isError);
        if (err) {
          if (msgKeyFallback) err.textContent = App.t(msgKeyFallback);
          err.classList.toggle('hidden', !isError);
        }
      }

      const validateEmail = email => EMAIL_REGEX.test(email.trim());

      function setBtnLoading(btn, text, on) {
        if (on) {
          btn.dataset.originalText = btn.textContent;
          btn.disabled = true;
          btn.textContent = text;
        } else {
          btn.disabled = false;
          btn.textContent = btn.dataset.originalText || btn.textContent;
          delete btn.dataset.originalText;
        }
      }

      // PASSWORD TOGGLE
      els.togglePass.addEventListener('click', (e) => {
        e.preventDefault();
        const hidden = els.password.type === 'password';
        els.password.type = hidden ? 'text' : 'password';
        els.togglePass.textContent = hidden ? App.t("hide_btn") : App.t("show_btn");
      });

      function validateLoginForm() {
        const email = els.email.value.trim();
        const pass = els.password.value;
        let ok = true;

        if (!validateEmail(email)) {
          setError('email', true);
          ok = false;
        } else setError('email', false);

        if (!pass) {
          setError('password', true);
          ok = false;
        } else setError('password', false);

        return ok;
      }

      ['email', 'password'].forEach(id => {
        qs('#' + id).addEventListener('input', () => setError(id, false));
      });

      // LOGIN SUBMIT
      els.loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!validateLoginForm()) return;

        setBtnLoading(els.loginBtn, App.t("signing_in"), true);

        try {
          const res = await fetch(`${API_URL}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: els.email.value.trim(),
              password: els.password.value
            })
          });
          const data = await res.json();

          if (res.ok) {
            localStorage.setItem('token', data.token);
            App.showToast(App.t("login_success"), "success");
            setTimeout(() => location.href = 'index.html', 100);
          } else {
            App.showToast(data.error || App.t("login_failed"), "error");
          }
        } catch (err) {
          console.error(err);
          App.showToast(App.t("generic_error"), "error");
        } finally {
          setBtnLoading(els.loginBtn, '', false);
        }
      });

      // FORGOT MODAL
      const openForgot = () => {
        els.modal.classList.remove('hidden');
        els.modal.classList.add('flex');
        els.forgotEmail.focus();
      };
      const closeForgot = () => {
        els.modal.classList.add('hidden');
        els.modal.classList.remove('flex');
        els.forgotEmail.value = '';
      };

      els.forgotBtn.addEventListener('click', openForgot);
      els.forgotClose.addEventListener('click', closeForgot);
      els.modal.addEventListener('click', (e) => e.target === els.modal && closeForgot());

      els.forgotSend.addEventListener('click', async () => {
        const email = els.forgotEmail.value.trim();

        if (!validateEmail(email)) {
          App.showToast(App.t("enter_valid_email"), "error");
          return;
        }

        setBtnLoading(els.forgotSend, App.t("sending"), true);

        try {
          const res = await fetch(`${API_URL}/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json();

          if (res.ok) {
            App.showToast(data.message || App.t("reset_link_sent"), "success");
            closeForgot();
          } else {
            App.showToast(data.error || App.t("reset_link_failed"), "error");
          }
        } catch (err) {
          console.error(err);
          App.showToast(App.t("network_error"), "error");
        } finally {
          setBtnLoading(els.forgotSend, '', false);
        }
      });

      // RESET PASSWORD MODE
      const token = new URLSearchParams(location.search).get('token');

      function showResetMode() {
        els.loginBlock.classList.add('hidden');
        els.resetBlock.classList.remove('hidden');
        els.pageMsg.textContent = '';
      }

      function showLoginMode() {
        els.resetBlock.classList.add('hidden');
        els.loginBlock.classList.remove('hidden');
        els.pageMsg.textContent = '';
        history.replaceState({}, '', 'login.html');
      }

      if (token) showResetMode();
      els.backToLogin.addEventListener('click', showLoginMode);

      els.resetForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!token) return;

        const newPassword = els.newPassword.value;
        const repeatPassword = els.repeatPassword.value;

        if (!newPassword || newPassword.length < 6) {
          els.pageMsg.textContent = App.t("pass_min_len");
          els.pageMsg.style.color = 'tomato';
          return;
        }
        if (newPassword !== repeatPassword) {
          els.pageMsg.textContent = App.t("pass_not_match");
          els.pageMsg.style.color = 'tomato';
          return;
        }

        setBtnLoading(els.resetBtn, App.t("updating"), true);
        els.pageMsg.textContent = '';

        try {
          const res = await fetch(`${API_URL}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
          });
          const data = await res.json();

          if (res.ok) {
            els.pageMsg.textContent = data.message || App.t("pass_updated");
            els.pageMsg.style.color = 'limegreen';
            setTimeout(showLoginMode, 1200);
          } else {
            els.pageMsg.textContent = data.error || App.t("reset_failed");
            els.pageMsg.style.color = 'tomato';
          }
        } catch (err) {
          console.error(err);
          els.pageMsg.textContent = App.t("network_error");
          els.pageMsg.style.color = 'tomato';
        } finally {
          setBtnLoading(els.resetBtn, '', false);
        }
      });
      function stripAuthNav() {
        App.qsa('#nav-links a[href="cart.html"], #nav-mobile a[href="cart.html"]').forEach(a => a.remove());
      }
      stripAuthNav();
      qs('.reveal')?.classList.add('in');
    })();
  </script>
</body>
</html>
