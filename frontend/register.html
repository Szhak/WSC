<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - Book Marketplace</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
</head>

<body class="min-h-screen">
  <div class="mesh" id="mesh"></div>
  <div class="noise"></div>

  <!-- COMMON NAVBAR MOUNT -->
  <div id="app-navbar"></div>

  <main class="min-h-[calc(100vh-56px)] flex items-center justify-center px-4">
    <div class="panel w-full max-w-md rounded-3xl p-6 md:p-7 shadow-2xl reveal">
      <div class="text-center mb-5">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight" data-i18n="register_title"></h1>
        <p class="text-sm mt-1" style="color:var(--muted2)" data-i18n="register_subtitle"></p>
      </div>

      <form id="register-form" class="space-y-3">
        <div>
          <label class="block text-xs mb-1" style="color:var(--muted2)" data-i18n="name_label"></label>
          <input id="name" type="text" class="inp" data-i18n-placeholder="name_placeholder" placeholder=""/>
          <p id="err-name" class="text-xs mt-1 text-red-400 hidden" data-i18n="err_name"></p>
        </div>

        <div>
          <label class="block text-xs mb-1" style="color:var(--muted2)" data-i18n="email_label"></label>
          <input id="email" type="email" class="inp" data-i18n-placeholder="email_placeholder" placeholder=""/>
          <p id="err-email" class="text-xs mt-1 text-red-400 hidden" data-i18n="err_email"></p>
        </div>

        <div>
          <label class="block text-xs mb-1" style="color:var(--muted2)" data-i18n="password_label"></label>
          <div class="relative">
            <input id="password" type="password" class="inp pr-12" data-i18n-placeholder="password_placeholder" placeholder=""/>
            <button type="button" id="toggle-pass"
              class="absolute right-2 top-1/2 -translate-y-1/2 btn-ghost text-xs px-2 py-1"
              data-i18n="show_btn"></button>
          </div>
          <p id="err-password" class="text-xs mt-1 text-red-400 hidden" data-i18n="err_password_min"></p>
        </div>

        <button id="register-btn" type="submit" class="btn-primary w-full mt-2" data-i18n="register_btn"></button>

        <p class="text-center text-sm mt-2" style="color:var(--muted)">
          <span data-i18n="already_have"></span>
          <a href="login.html" class="underline font-semibold" data-i18n="login_btn"></a>
        </p>
      </form>
    </div>
  </main>

  <!-- Toast (нужен для App.showToast) -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden text-white px-4 py-2 rounded-lg shadow"></div>

  <!--  COMMON UTILS (global App) -->
  <script src="utils.js"></script>

  <script>
    (async function () {
      await App.initCommon({ i18nUrl: "i18n.json" });

      App.qs("#app-footer")?.classList.add("hidden");

      function stripAuthNav() {
        App.qsa('#nav-links a[href="cart.html"], #nav-mobile a[href="cart.html"]').forEach(a => a.remove());
      }
      stripAuthNav();

      const API_URL = App.API_URL; // "/api"
      const qs = App.qs;

      const els = {
        form: qs('#register-form'),
        name: qs('#name'),
        email: qs('#email'),
        password: qs('#password'),
        btn: qs('#register-btn'),
        togglePass: qs('#toggle-pass')
      };

      function setError(id, isError, msgKey) {
        const input = qs('#' + id);
        const err = qs('#err-' + id);
        input.classList.toggle('error', isError);
        if (err) {
          if (msgKey) err.textContent = App.t(msgKey);
          err.classList.toggle('hidden', !isError);
        }
      }

      function validate() {
        const name = els.name.value.trim();
        const email = els.email.value.trim();
        const password = els.password.value;

        let ok = true;

        if (!name) { setError('name', true); ok = false; }
        else setError('name', false);

        const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if (!emailOk) { setError('email', true); ok = false; }
        else setError('email', false);

        if (!password || password.length < 6) {
          setError('password', true);
          ok = false;
        } else setError('password', false);

        return ok;
      }

      ['name','email','password'].forEach(id => {
        qs('#' + id).addEventListener('input', () => setError(id, false));
      });

      // PASSWORD TOGGLE
      els.togglePass.addEventListener('click', (e) => {
        e.preventDefault();
        const hidden = els.password.type === 'password';
        els.password.type = hidden ? 'text' : 'password';
        els.togglePass.textContent = hidden ? App.t("hide_btn") : App.t("show_btn");
      });

      function setBtnLoading(on, textKey) {
        if (on) {
          els.btn.dataset.originalText = els.btn.textContent;
          els.btn.disabled = true;
          els.btn.textContent = App.t(textKey);
        } else {
          els.btn.disabled = false;
          els.btn.textContent = els.btn.dataset.originalText || els.btn.textContent;
          delete els.btn.dataset.originalText;
        }
      }

      // REGISTER SUBMIT
      els.form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!validate()) return;

        const name = els.name.value.trim();
        const email = els.email.value.trim();
        const password = els.password.value;

        setBtnLoading(true, "creating");

        try {
          const res = await fetch(`${API_URL}/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password })
          });
          const data = await res.json();

          if (res.ok) {
            App.showToast(App.t("register_success"), "success");
            setTimeout(() => { location.href = 'login.html'; }, 1000);
          } else {
            App.showToast(data.error || App.t("register_failed"), "error");
          }
        } catch (err) {
          console.error(err);
          App.showToast(App.t("generic_error"), "error");
        } finally {
          setBtnLoading(false);
        }
      });

      qs('.reveal')?.classList.add('in');
    })();
  </script>
</body>
</html>
